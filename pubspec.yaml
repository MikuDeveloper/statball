name: statball
description: "Application for managing statesmanship of players football."
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  flutter_riverpod: ^3.3.2-dev.2
  freezed_annotation: ^3.1.0
  go_router: ^17.2.3
  google_fonts: ^8.1.0
  json_annotation: ^4.12.0
  logging: ^1.3.0
  path_provider: ^2.1.5
  reactive_forms: ^18.2.2
  riverpod_annotation: ^4.0.3-dev.2
  supabase_flutter: ^2.12.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  go_router_builder: ^4.3.0
  build_runner: ^2.15.0
  freezed: ^3.2.5
  json_serializable: ^6.14.0
  riverpod_generator: ^4.0.4-dev.3

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/
    - assets/config/
    - assets/fonts/
    - assets/pictures/
    - assets/launcher/
